<!-- 결제창에서 돌아오는 자리. 여기서 끝나는 게 아니라, ★서버가 다시 승인해야 결제가 확정된다.
     브라우저가 돌려받은 금액을 그대로 믿지 않고 ph-pay-confirm이 원장과 대조한다. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 결과 · PHARMACIAN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--page:#F3F3F1;--ink:#17181A;--ink-2:#5A5D63;--ink-3:#8E9299;--line:#E3E3DF;--accent:#E8380D;--ok:#0E7C4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);line-height:1.6;word-break:keep-all;
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 28px;text-align:center}
.mark{width:54px;height:54px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:#fff;background:var(--ink-3)}
.mark.ok{background:var(--ok)} .mark.no{background:var(--accent)}
h1{font-size:21px;font-weight:800;letter-spacing:-.03em}
p{margin-top:10px;font-size:14.5px;color:var(--ink-2)}
dl{margin-top:22px;border-top:1px solid var(--line);text-align:left}
dl div{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
dt{color:var(--ink-3)} dd{font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all;text-align:right;margin-left:14px}
.go{display:inline-block;margin-top:24px;font-size:14.5px;font-weight:700;color:var(--accent);
  text-decoration:underline;text-underline-offset:4px}
</style>
<style>body{background:var(--sh-bg);color:var(--sh-ink)}</style>
</head>
<body>
<div data-shell></div>
<div class="card">
  <div class="mark" id="mark">·</div>
  <h1 id="title">결제를 확인하고 있습니다</h1>
  <p id="msg">잠시만 기다려 주세요.</p>
  <dl id="detail"></dl>
  <a class="go" href="./" data-home>PHARMACIAN로 돌아가기</a>
</div>

<script src="config.js"></script>
<script src="cart.js"></script>
<script src="track.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const C = window.PHARMACIAN || {};
  const q = new URLSearchParams(location.search);
  const won = n => Number(n).toLocaleString('ko-KR');

  const show = (kind, title, msg, rows) => {
    $('#mark').className = 'mark ' + kind;
    $('#mark').textContent = kind === 'ok' ? '✓' : kind === 'no' ? '!' : '·';
    $('#title').textContent = title;
    $('#msg').textContent = msg;
    $('#detail').innerHTML = (rows || []).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  };

  // 결제창이 실패로 돌려보낸 경우
  if (q.get('code')) {
    show('no', '결제가 완료되지 않았습니다', q.get('message') || '결제가 취소되었거나 실패했습니다.',
      [['사유 코드', q.get('code')]]);
    return;
  }

  const paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = q.get('amount');
  if (!paymentKey || !orderId || !amount) {
    show('no', '잘못된 접근입니다', '결제 정보가 없습니다.');
    return;
  }

  // ★여기가 핵심. 브라우저가 들고 온 amount를 믿지 않고 서버가 원장과 대조해 승인한다.
  fetch(`${C.SUPABASE_URL}/functions/v1/ph-pay-confirm`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
  })
    .then(async r => ({ ok: r.ok, body: await r.json() }))
    .then(({ ok, body }) => {
      if (ok && body.ok) {
        show('ok', '결제가 완료되었습니다', '주문 내역은 등록하신 연락처로 안내드립니다.',
          [['주문번호', body.orderId], ['결제 금액', won(body.amount) + '원']]);
        // ★전환 보고. 서버(ph-pay-confirm)도 같은 주문번호를 event_id로 메타에 보내므로
        //   광고차단·추적거부로 이 줄이 안 돌아도 전환은 잡힌다(중복은 메타가 걷어낸다).
        //   중복 확인(duplicate)일 때는 보내지 않는다 — 같은 결제를 두 번 세면 안 된다.
        if (window.PHARMACIAN_TRACK && !body.duplicate) {
          window.PHARMACIAN_TRACK.purchase({ value: body.amount, orderId: body.orderId });
        }
      } else {
        show('no', '결제가 승인되지 않았습니다',
          body.error || '승인 과정에서 문제가 발생했습니다. 결제가 되었다면 자동으로 취소됩니다.',
          [['주문번호', orderId]]);
      }
    })
    .catch(() => show('no', '승인 확인에 실패했습니다', '잠시 후 다시 확인해 주세요.', [['주문번호', orderId]]));
})();
</script>
<script src="shell.js"></script>
</body>
</html>
