<!-- 배송 명단 화면(관리자 전용).
     ★이 화면에는 만능키가 없다. 로그인 토큰만 들고 ph-admin-orders 를 부르고,
       "관리자인가"는 서버가 ph_admin 표를 보고 정한다.
       그래서 이 파일을 통째로 뜯어봐도 남의 명단을 볼 방법이 없다.
     ★검색에서도 막는다(robots.txt + noindex). -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배송 명단 · PHARMACIAN</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sh-bg);color:var(--sh-ink)}
.wrap{max-width:1200px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:24px;font-weight:800;letter-spacing:-.04em}
.sub{margin-top:6px;font-size:13.5px;color:var(--sh-muted)}
.bar{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
.bar button{height:38px;padding:0 15px;border:1px solid var(--sh-rule);border-radius:9px;
  background:var(--surface);color:var(--sh-ink);font:700 13.5px/1 inherit;cursor:pointer}
.bar button:hover{border-color:var(--sh-muted)}
.bar .on{background:var(--sh-ink);color:var(--sh-bg);border-color:var(--sh-ink)}
.bar .grow{margin-left:auto;font-size:13px;color:var(--sh-muted)}
.bar[hidden]{display:none}   /* display:flex 가 hidden 속성을 이기므로 명시한다 */
.box{margin-top:16px;background:var(--surface);border:1px solid var(--sh-rule);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--sh-rule)}
th{background:rgba(0,0,0,.02);font-weight:800;font-size:12.5px;color:var(--sh-muted)}
tr:last-child td{border-bottom:0}
td.addr{white-space:normal;min-width:260px;line-height:1.55}
td.num{font-variant-numeric:tabular-nums}
.st{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.st-ordered{background:#E3F2FD;color:#0D47A1}
.bar button.danger{border-color:#DC2626;color:#DC2626}
.bar button.danger:hover{background:#FEF2F2}
.st-paid{background:#E7F6EC;color:#0E7C4A}
.st-pending{background:#F1F1F1;color:#666}
.st-canceled,.st-failed{background:#FDECEA;color:#B3261E}
.msg{padding:44px 22px;text-align:center;font-size:14.5px;color:var(--sh-muted);line-height:1.7}
.msg a{color:var(--sh-pt);font-weight:700}
.copy{height:30px;padding:0 10px;border:1px solid var(--sh-rule);border-radius:7px;
  background:var(--surface);font:600 12px/1 inherit;cursor:pointer;color:var(--sh-ink)}
.box .pick{width:34px;text-align:center}
.box .pick input{width:16px;height:16px;accent-color:var(--sh-ink)}
.hint{margin-top:10px;font-size:12.5px;color:var(--sh-muted);line-height:1.65}
@media(max-width:640px){.wrap{padding:22px 14px 60px}h1{font-size:20px}th,td{padding:9px 10px}}
</style>
</head>
<body>
<div data-shell></div>
<div class="wrap">
  <h1>배송 명단</h1>
  <p class="sub">주문을 받은 순서로 보여줍니다. 결제완료 건을 체크해 <b>발주완료로</b> 넘기면 발주완료 칸으로 옮겨갑니다. 필요한 칸을 고르고 CSV로 내려받습니다. 이 화면은 관리자에게만 열립니다.</p>

  <div class="bar" id="bar" hidden>
    <button type="button" data-f="all" class="on">전체</button>
    <button type="button" data-f="paid">결제완료</button>
    <button type="button" data-f="ordered">발주완료</button>
    <button type="button" id="reload">새로고침</button>
    <button type="button" id="csv">CSV로 내려받기</button>
    <button type="button" id="poCsv">발주서 양식 엑셀</button>
    <button type="button" id="listOrdered">체크한 것 발주완료로</button>
    <span class="grow" id="count"></span>
  </div>
  <p id="poWarn" style="margin:8px 0 0;font-size:13px;color:#B3261E;font-weight:700;line-height:1.6"></p>

  <div class="box"><div class="scroll" id="out">
    <p class="msg">불러오는 중입니다…</p>
  </div></div>

</div>

<script src="config.js"></script>
<script src="cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="window.__nosb=1"></script>
<!-- 발주서를 엑셀(.xlsx)로 내보낸다. 못 불러오면 CSV로 떨어진다 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const C = window.PHARMACIAN || {};
  const out = $('#out');
  const say = h => { out.innerHTML = '<p class="msg">' + h + '</p>'; };
  if (window.__nosb || !window.supabase) { say('연결 준비 중입니다.'); return; }
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON);

  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // ★'발주시각' = 관리자가 발주완료로 넘긴 시각(뷰 ph_order_sheet 의 새 칸).
  // ★'취소' = 누가 취소했나(고객취소/관리자취소)와 그 시각.
  const COLS = ['접수','상태','발주시각','취소','주문번호','품목','금액','받는분','연락처','주소','배송메모'];
  const 상태말 = { paid: '결제완료', ordered: '발주완료', pending: '미결제', canceled: '취소', failed: '실패' };
  let rows = [], filter = 'all';

  const view = () => filter === 'all' ? rows : rows.filter(r => r['상태'] === filter);

  function draw() {
    const v = view();
    $('#count').textContent = `전체 ${rows.length}건 · 보이는 것 ${v.length}건`;
    if (!v.length) { say('아직 들어온 주문이 없습니다.'); return; }
    out.innerHTML =
      '<table><thead><tr><th class="pick"><input type="checkbox" id="pickAll" title="보이는 줄 전체 선택"></th>' + COLS.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' +
      v.map(r => '<tr>' +
        `<td class="pick"><input type="checkbox" data-oid="${esc(r['주문번호'])}"></td>` +
        COLS.map(c => {
        if (c === '상태') return `<td><span class="st st-${esc(r[c])}">${esc(상태말[r[c]] || r[c])}</span></td>`;
        if (c === '취소') return `<td>${r['취소주체'] ? '<span class="st st-canceled">' + esc(r['취소주체']) + '</span> ' + esc(r['취소시각'] || '') : ''}</td>`;
        if (c === '금액') return `<td class="num">${Number(r[c] || 0).toLocaleString('ko-KR')}원</td>`;
        if (c === '주소') return `<td class="addr">${esc(r[c])} <button class="copy" data-copy="${esc(r[c])}">복사</button></td>`;
        return `<td${c === '접수' ? ' class="num"' : ''}>${esc(r[c])}</td>`;
      }).join('') + '</tr>').join('') + '</tbody></table>';
    out.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
      navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = '복사됨'; setTimeout(() => b.textContent = '복사', 1200); });
    }));
    const all = $('#pickAll');
    if (all) all.addEventListener('change', () => out.querySelectorAll('[data-oid]').forEach(b => { b.checked = all.checked; }));
  }

  let 세션 = null;   // ★현재 세션. 콜백이 채운다 — getSession() 을 다시 부르지 않는다.

  async function load() {
    const session = 세션;
    if (!session) { say('관리자 계정으로 로그인해 주세요.<br><a href="join.html?back=admin">로그인하러 가기</a>'); return; }
    say('불러오는 중입니다…');
    let res;
    try {
      res = await fetch(`${C.SUPABASE_URL}/functions/v1/ph-admin-orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: '{}',
      });
    } catch (e) { say('불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); return; }
    // ★관리자가 아니면 서버가 404를 준다(있다는 것도 안 알린다).
    //   ★다만 500(명단을 못 불러옴)까지 같은 말로 뭉뚱그리면, 권한 설정이 빠진 건데
    //     "너는 관리자가 아니다"로 읽힌다 — 실제로 그렇게 헷갈린 적이 있다. 원인을 갈라서 말한다.
    if (res.status === 404) { say('이 계정으로는 볼 수 없는 화면입니다.'); return; }
    if (!res.ok) {
      let why = '';
      try { why = (await res.json()).error || ''; } catch (e) {}
      say('명단을 불러오지 못했습니다.' + (why ? '<br>' + why : '') +
          '<br><span style="font-size:12.5px">(' + res.status + ')</span>');
      return;
    }
    const body = await res.json();
    rows = (body && body.rows) || [];
    $('#bar').hidden = false;
    draw();
  }

  $('#bar').addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    filter = b.dataset.f;
    [...$('#bar').querySelectorAll('[data-f]')].forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  $('#reload').addEventListener('click', load);
  /* ★두 내려받기(CSV·발주서 엑셀) 모두 ★체크한 줄만 받는다(2026-10-01 루비 「선택한거 다운로드할수있게 · 지금은 전체가 다운로드됨」).
     전부 받으려면 표 머리의 체크박스로 보이는 줄 전체를 고른다. 하나도 안 골랐으면 받지 않고 알린다. */
  function pickedRows() {
    const ids = new Set(listPicked());
    return view().filter(r => ids.has(String(r['주문번호'])));
  }
  $('#csv').addEventListener('click', () => {
    const v = pickedRows();
    if (!v.length) { $('#poWarn').textContent = '체크한 주문이 없습니다. 내려받을 주문을 체크해 주세요(표 맨 위 칸 = 전체 선택).'; return; }
    $('#poWarn').textContent = '';
    // 엑셀이 한글을 깨뜨리지 않게 BOM을 앞에 붙인다
    const csv = '﻿' + [COLS.join(',')].concat(
      v.map(r => COLS.map(c => {
        // ★'취소'는 화면에서만 합쳐 보여주는 칸이라 원본에 없다. 내려받는 표에도 같은 내용을 담는다.
        const val = c === '취소' ? [r['취소주체'], r['취소시각']].filter(Boolean).join(' ') : r[c];
        return `"${String(val == null ? '' : val).replace(/"/g, '""')}"`;
      }).join(','))
    ).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'pharmacian_배송명단.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  /* ★발주서 양식 엑셀(.xlsx · 2026-10-01 루비 「xlsx로 바꿔줘」 — CSV는 엑셀이 우편번호 앞 0을 지운다) — 물류사(스카이물류) 「YL_통합 발주서」 칸 그대로(2026-10-01 루비).
     한 줄 = 한 주문 × 한 상품. ★같은 사람이 여러 개를 사도 상품 종류가 다르면 줄을 나눈다.
     묶음(3개·1+1)·세트는 낱개로 펴서 같은 상품끼리 합친다 — 물류사가 낱개 수량으로 받는다.
     ★결제완료·발주완료만 넣는다(돈 안 받은 건에 물건이 나가면 손실). 대응표는 옛 발주서 화면(deploy 0462dcd 이전)에서 왔다. */
  const PO_COLS = ['발주일','순번','상품명','수량(낱개)','보내는분','받는분','받는분 연락처1',
                   '받는분 연락처2','우편번호','주소','배송시요청사항','배송사','운송장번호','비고'];
  const PO_OK = new Set(['paid', 'ordered']);
  // ★원본 양식 열 너비. SheetJS 는 wch 에 패딩 0.832 를 더해 쓰므로 미리 뺀다(옛 발주서 화면에서 실측).
  const PO_WCH = [9.875,4.625,31.25,11,17.875,15,15.25,13.75,7.5,41.875,19.125,11.5,13.125,12.875].map(w => w - 0.832);
  const PO_NUM = new Set(['발주일','순번','수량(낱개)']);   // 원본이 숫자로 들고 있는 칸. 우편번호·연락처는 글자(앞 0 보존)
  // 우리 상품 이름표·키 → 물류사 보유품목 정식 상품명(보유품목 시트 표기 그대로) × 낱개 배수
  const P7 = 'VCXO 파머시안 피디알엔 7000 크림 30g', P12 = 'VCXO 파머시안 피디알엔 12000 크림 30g',
        NMN = 'VCXO 파머시안 엔엠엔 30000 크림 30g',  MEL = 'VCXO 파머시안 멜라리스 100000 크림 30g';
  const SKU = {
    'PDRN 7000': [[P7, 1]], 'PDRN 12000': [[P12, 1]], 'NMN 30000': [[NMN, 1]], '멜라리스': [[MEL, 1]],
    'p7': [[P7, 1]], 'p12': [[P12, 1]], 'nmn': [[NMN, 1]], 'mel': [[MEL, 1]],
    // ★구성(1+1·3개). 뷰의 이름표에 없는 키라 원본 키 그대로 넘어온다.
    'p7x3': [[P7, 3]], 'melx3': [[MEL, 3]], 'p12x2': [[P12, 2]], 'nmnx2': [[NMN, 2]],
    '세트 PDRN 2종': [[P7, 1], [P12, 1]], '세트 아침밤 2종': [[MEL, 1], [NMN, 1]],
  };
  // '품목'('PDRN 7000 2개 + p12x2 1개') → [[정식명, 낱개수]] · 같은 상품은 합친다 · 모르는 이름은 따로 센다
  function explode(품목, 모름) {
    const 합 = new Map();
    String(품목 || '').split(' + ').forEach(part => {
      part = part.trim(); if (!part) return;
      const m = /^(.*?)\s+(\d+)개$/.exec(part);
      const nm = m ? m[1].trim() : part, qty = m ? Number(m[2]) : 1;
      const 대응 = SKU[nm];
      if (!대응) { 모름.push(nm); 합.set(nm, (합.get(nm) || 0) + qty); return; }
      대응.forEach(([정식명, 배수]) => 합.set(정식명, (합.get(정식명) || 0) + 배수 * qty));
    });
    return [...합];
  }
  // 뷰가 '(우편번호) 주소1 주소2'로 합쳐 주니 양식에 맞게 다시 가른다
  function splitAddr(v) {
    const m = /^\s*\(([^)]*)\)\s*(.*)$/.exec(String(v || ''));
    return m ? { zip: m[1].trim(), addr: m[2].trim() } : { zip: '', addr: String(v || '').trim() };
  }
  function 발주서행(목록, 발주일) {
    const 줄 = [], 모름 = [], 빈주문 = [];
    목록.filter(r => PO_OK.has(r['상태'])).forEach(r => {
      const { zip, addr } = splitAddr(r['주소']);
      const 품 = explode(r['품목'], 모름);
      if (!품.length) { 빈주문.push(r['주문번호']); return; }   // ★품목이 비면 조용히 빠지지 않게 센다
      품.forEach(([상품명, 수량]) => 줄.push({
        '발주일': 발주일, '순번': 줄.length + 1, '상품명': 상품명, '수량(낱개)': 수량, '보내는분': '',
        '받는분': r['받는분'], '받는분 연락처1': r['연락처'], '받는분 연락처2': '', '우편번호': zip, '주소': addr,
        '배송시요청사항': r['배송메모'] || '', '배송사': '', '운송장번호': '', '비고': '' }));
    });
    return { 줄, 모름, 빈주문 };
  }
  $('#poCsv').addEventListener('click', () => {
    const d = new Date(), 발주일 = String(d.getFullYear()) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const 고른 = pickedRows();
    if (!고른.length) { $('#poWarn').textContent = '체크한 주문이 없습니다. 내려받을 주문을 체크해 주세요(표 맨 위 칸 = 전체 선택).'; return; }
    const { 줄, 모름, 빈주문 } = 발주서행(고른, 발주일);
    const 경고 = [];
    if (모름.length) 경고.push('★물류사 상품명으로 못 바꾼 품목(원래 이름 그대로 넣음): ' + [...new Set(모름)].join(', '));
    if (빈주문.length) 경고.push('★품목이 비어 빠진 주문 ' + 빈주문.length + '건: ' + 빈주문.join(', '));
    $('#poWarn').textContent = 경고.join(' / ');
    if (!줄.length) { $('#poWarn').textContent = '체크한 주문 중 결제완료·발주완료 주문이 없습니다.' + (경고.length ? ' ' + 경고.join(' / ') : ''); return; }
    const 이름 = 'YL_통합 발주서_스카이물류_' + 발주일.replace(/(\d{4})(\d{2})(\d{2})/, '$1.$2.$3') + ' (택배).';
    const aoa = [PO_COLS].concat(줄.map(x => PO_COLS.map(c => PO_NUM.has(c) ? Number(x[c]) : String(x[c] == null ? '' : x[c]))));
    if (window.XLSX) {
      const ws = window.XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = PO_WCH.map(w => ({ wch: w }));    // 원본 열 너비 그대로
      const wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, ws, '발주서');
      window.XLSX.writeFile(wb, 이름 + 'xlsx');
      return;
    }
    // ★엑셀 라이브러리를 못 불러온 경우에도 손이 멈추지 않게 CSV로 내보낸다(한글 BOM).
    //   ★엑셀은 따옴표로 감싼 "06236" 도 숫자로 읽어 6236 으로 만든다. ="..." 로 줘야 글자로 남는다
    const csv = '﻿' + aoa.map(r => r.map(v => { const t = String(v).replace(/"/g, '""');
      return /^0\d+$/.test(t) ? '="' + t + '"' : '"' + t + '"'; }).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 이름 + 'csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  window.__PH_PO = { 발주서행, explode, splitAddr };   // 시험용(_확인_발주서양식.mjs)

  // 명단에서 체크한 주문번호
  function listPicked() {
    return [...out.querySelectorAll('[data-oid]')].filter(b => b.checked).map(b => b.dataset.oid);
  }

  const NL = String.fromCharCode(10);   // 문자열 안에 개행을 직접 쓰지 않는다

  async function callAdmin(payload) {
    const session = 세션;
    if (!session) { alert('로그인이 풀렸습니다. 새로고침 후 다시 시도해 주세요.'); return null; }
    const res = await fetch(`${C.SUPABASE_URL}/functions/v1/ph-admin-orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify(payload),
    });
    if (res.status === 404) { alert('이 계정으로는 할 수 없는 일입니다.'); return null; }
    if (!res.ok) {
      let why = ''; try { why = (await res.json()).error || ''; } catch (e) {}
      alert('처리하지 못했습니다.' + (why ? NL + why : '') + NL + '(' + res.status + ')');
      return null;
    }
    return res.json();
  }

  // ★결제완료 → 발주완료. 이 한 방향뿐이다(2026-09-28 루비 : 결제단 붙기 전 흐름은 전부 없앴다).
  async function markOrdered() {
    const ids = listPicked();
    if (!ids.length) { alert('체크된 줄이 없습니다.'); return; }
    if (!confirm('주문 ' + ids.length + '건을 발주완료로 넘기겠습니까?' + NL + '★결제완료 건만 넘어갑니다. 되돌리기는 없습니다.' + NL + NL + ids.join(NL))) return;
    const r = await callAdmin({ action: 'markOrdered', orderIds: ids });
    if (!r) return;
    // ★서버(함수·DB)가 아직 이 기능을 모르면 명단이 그대로 돌아온다. 그때 '성공'처럼 보이면 안 된다.
    if (typeof r.done !== 'number') { alert('서버에 이 기능이 아직 올라가지 않았습니다.' + NL + '관리자에게 알려 주세요.'); return; }
    let msg = r.done + '건 발주완료로 넘겼습니다.';
    if (r.skipped && r.skipped.length) {
      msg += NL + NL + '넘어가지 않은 건:' + NL + r.skipped.map(s => '· ' + s.id + ' — ' + s.why).join(NL);
    }
    alert(msg);
    await load();
  }
  $('#listOrdered').addEventListener('click', markOrdered);

  // ★onAuthStateChange 콜백은 인증 락을 ★쥔 채로 돈다. 그 안에서 getSession() 을 부르면
  //   자기가 쥔 락을 자기가 기다려 ★영영 안 끝난다(2026-09-01 라이브 실측 — 8.9초 무응답,
  //   navigator.locks 에 lock:sb-...-auth-token 이 held 로 남아 있었다).
  //   ★세션은 콜백이 인자로 준다. 받아서 쓴다.
  sb.auth.onAuthStateChange((_e, s) => { 세션 = s; setTimeout(load, 0); });
})();
</script>
<script src="shell.js"></script>
</body>
</html>
