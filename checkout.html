<!-- PHARMACIAN 결제 화면. 폐쇄몰이라 로그인해야 가격이 보이고 결제도 로그인 뒤에만 열린다.
     ★금액은 이 화면이 정하지 않는다. ph-order-create(서버)가 정하고, 여기는 받아서 보여주기만 한다. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 · PHARMACIAN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 색은 shell.css 가 정한다 — 여기서 따로 두면 다른 사이트로 보인다 */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);}
.wrap{max-width:620px;margin:0 auto;padding:48px 20px 80px}
a{color:inherit}
h1{font-size:26px;font-weight:800;letter-spacing:-.04em}
.back{display:inline-block;margin-bottom:20px;font-size:14px;color:var(--ink-3);text-decoration:none}
.back:hover{color:var(--ink)}
.box{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;font-size:15px;font-weight:700;letter-spacing:-.02em}
.row .pr{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font:inherit;font-weight:800;cursor:pointer;color:var(--ink-2)}
.qty button:hover{border-color:var(--ink-3)}
.qty input{width:44px;height:30px;border:1px solid var(--line);border-radius:8px;text-align:center;
  font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
.sum{margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);padding:4px 0}
.sum .tot{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);
  font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.num{font-variant-numeric:tabular-nums}
.pay{margin-top:22px;width:100%;height:56px;border:0;border-radius:12px;background:var(--ink);color:var(--sh-bg);
  font:inherit;font-size:16.5px;font-weight:700;letter-spacing:-.02em;cursor:pointer}
.pay:disabled{opacity:.4;cursor:not-allowed}
.note{margin-top:14px;font-size:13px;color:var(--ink-3)}
.cbtn{margin-top:16px;width:100%;height:46px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:700 14.5px/1 inherit;border-radius:10px;cursor:pointer}
.gate{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;text-align:center}
.gate p{font-size:15px;color:var(--ink-2)}
.gate a{display:inline-block;margin-top:16px;font-weight:700;color:var(--accent);
  text-decoration:underline;text-underline-offset:4px}
.hide{display:none}
#payment-method,#agreement{margin-top:18px}
/* 배송지 칸. 결제 단계에서 받는다(로그인은 신원 확인만 하므로 주소를 그때 받지 않는다). */
.bt{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.av{font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.av b{color:var(--ink)}
.af input{width:100%;height:44px;margin-top:9px;padding:0 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px}
.af input:read-only{color:var(--ink-2)}
.af .zr{display:flex;gap:8px}
.af .zr input{max-width:150px}
.af .zr button{margin-top:9px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.aerr{margin-top:9px;font-size:13px;color:var(--bad);display:none}
.aerr.on{display:block}
</style>
<style>body{background:var(--sh-bg);color:var(--sh-ink)}</style>
</head>
<body>
<div data-shell></div>
<div class="wrap">
  <h1>결제</h1>

  <!-- 비로그인: 가격도 결제도 안 열린다 -->
  <div class="gate" id="gate">
    <p>주문에는 로그인이 필요합니다.<br>배송지와 주문 내역을 계정에 남기기 위해서입니다.</p>
    <a href="join.html" data-home>로그인하러 가기</a>
  </div>

  <div id="shop" class="hide">
    <div class="box" id="items"></div>
    <div class="box sum" id="sum"></div>

    <div class="box" id="addrbox">
      <div class="bt">배송지</div>
      <div class="av hide" id="a-view">
        <div><b id="a-name"></b> · <span id="a-tel"></span></div>
        <div id="a-addr"></div>
        <div id="a-memo"></div>
        <button type="button" class="cbtn" id="a-edit">다른 주소로 받기</button>
      </div>
      <div class="af hide" id="a-form">
        <input id="a-in-name" autocomplete="name" placeholder="받는 분">
        <input id="a-in-tel" inputmode="numeric" autocomplete="tel" placeholder="연락처 (숫자만)">
        <div class="zr">
          <input id="a-in-zip" placeholder="우편번호" readonly>
          <button type="button" id="a-find">주소 찾기</button>
        </div>
        <input id="a-in-addr1" placeholder="주소" readonly>
        <input id="a-in-addr2" autocomplete="address-line2" placeholder="상세주소 (동·호수)">
        <input id="a-in-memo" placeholder="배송 메모 (선택)">
        <p class="aerr" id="a-err"></p>
      </div>
    </div>

    <div id="payment-method"></div>
    <div id="agreement"></div>
    <button class="pay" id="pay" type="button" disabled>결제하기</button>
    <p class="note" id="note">금액은 서버에서 정해집니다. 결제창에서 금액이 바뀌면 승인되지 않습니다.</p>
  </div>
</div>

<script src="config.js"></script>
<script src="cart.js"></script>
<script src="track.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="window.__nosb=1"></script>
<script src="https://js.tosspayments.com/v2/standard" onerror="window.__notoss=1"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" onerror="window.__nozip=1"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const C = window.PHARMACIAN || {};
  // 토스 심사가 끝나기 전까지는 살 물건과 받을 곳만 받아 둔다(config.js SALE_MODE).
  const RESERVE = (C.SALE_MODE || 'live') === 'reserve';
  const won = n => n.toLocaleString('ko-KR');
  if (window.__nosb || !window.supabase) { $('#gate').innerHTML = '<p>결제 준비 중입니다.</p>'; return; }
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON);

  const NOTE_RESERVE = '지금은 예약만 받습니다. 결제되는 금액은 없고, 결제가 열리면 순서대로 안내드립니다.';
  const NAMES = { p7: '파머시안 PDRN 7000 크림', p12: '파머시안 PDRN 12000 크림', nmn: '파머시안 NMN 30,000 크림', mel: '파머시안 멜라리스 100,000 크림',
    set1: '꿀조합SET · PDRN 라인 2종 (7000 + 12000)', set2: '꿀조합SET · 아침밤 2종 (멜라리스 + NMN)' };
  // 세트는 이미 20% 깎인 값이다. 여기에 첫 구매 쿠폰을 또 얹지 않는다(서버도 같은 규칙).
  const IS_SET = k => k === 'set1' || k === 'set2';
  let rows = [], qty = {}, ship = 0, widgets = null, user = null, addr = null;
  // ★서버가 금액을 정하고 나면 그 값이 진짜다. 이 화면 계산은 어림이다.
  //   둘이 어긋난 채로 결제창을 띄우면 손님이 본 금액과 실제 청구액이 달라진다(쿠폰이 거절되는 경우).
  let srv = null;
  const stale = () => { srv = null; };

  const goods = () => rows.reduce((s, r) => s + r.price * (qty[r.key] || 0), 0);
  const count = () => rows.reduce((s, r) => s + (qty[r.key] || 0), 0);
  const FREE = (window.PHARMACIAN && window.PHARMACIAN.FREE_SHIP_OVER) || 30000;
  const shipFee = () => (count() && goods() < FREE) ? ship : 0;
  // 첫 구매 15% 쿠폰. 장바구니에서 적용하면 localStorage에 남고 여기로 이어진다. ★실제 적용은 서버가 최종 판정한다.
  const coupon = () => (count() > 0 && localStorage.getItem('ph_coupon') === '1');
  const couponBase = () => rows.reduce((s, r) => s + (IS_SET(r.key) ? 0 : r.price * (qty[r.key] || 0)), 0);
  const discount = () => coupon() ? Math.round(couponBase() * 0.15) : 0;
  const total = () => srv ? srv.amount : goods() - discount() + shipFee();

  function drawItems() {
    $('#items').innerHTML = rows.map(r => `
      <div class="row">
        <span class="nm">${NAMES[r.key] || r.key}</span>
        <span class="pr num">${won(r.price)}원</span>
        <span class="qty">
          <button type="button" data-k="${r.key}" data-d="-1">-</button>
          <input type="text" readonly value="${qty[r.key] || 0}" id="q-${r.key}">
          <button type="button" data-k="${r.key}" data-d="1">+</button>
        </span>
      </div>`).join('');
    $('#items').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k, d = +b.dataset.d;
      const before = qty[k] || 0;
      qty[k] = Math.max(0, Math.min(20, before + d));
      $('#q-' + k).value = qty[k];
      stale();
      // ★5단계 전환: 0에서 1로 올라간 순간이 '담았다'이다
      if (before === 0 && qty[k] === 1 && window.PHARMACIAN_TRACK) {
        const r = rows.find(x => x.key === k);
        window.PHARMACIAN_TRACK.addToCart({ key: k, name: NAMES[k] || k, value: r ? r.price : 0 });
      }
      drawSum();
    }));
  }

  function drawSum() {
    const n = count();
    const g = srv ? srv.goods : goods();
    const dc = srv ? srv.discount : discount();
    const sh = srv ? srv.ship : shipFee();
    $('#sum').innerHTML = `
      <div><span>상품 금액</span><span class="num">${won(g)}원</span></div>
      ${dc ? `<div><span>첫 구매 15% 쿠폰</span><span class="num">-${won(dc)}원</span></div>` : ''}
      <div><span>배송비</span><span class="num">${n ? (sh === 0 ? '무료' : won(sh) + '원') : '-'}</span></div>
      <div class="tot"><span>결제 예정 금액</span><span class="num">${won(total())}원</span></div>
      <button type="button" id="cbtn" class="cbtn">${coupon() ? '쿠폰 적용됨 · 해제하기' : '첫 구매 15% 쿠폰 적용'}</button>`;
    const cb = $('#cbtn');
    if (cb) cb.addEventListener('click', () => {
      if (localStorage.getItem('ph_coupon') === '1') localStorage.removeItem('ph_coupon');
      else localStorage.setItem('ph_coupon', '1');
      stale();
      drawSum();
    });
    $('#pay').disabled = n === 0 || (!RESERVE && !widgets) || !addrReady();
    if (widgets && n) widgets.setAmount({ currency: 'KRW', value: total() });
    if (RESERVE) $('#note').textContent = NOTE_RESERVE;
  }

  /* ── 배송지 ────────────────────────────────────────────────
     로그인은 신원 확인만 한다(가입 때 주소를 안 받는다). 그래서 받을 곳을 여기서 정한다.
     이미 등록한 주소가 있으면 그걸 보여주고, 없으면 폼을 편다. */
  const digits = v => v.replace(/\D/g, '');
  const telFmt = v => { const d = digits(v).slice(0, 11);
    return d.length < 4 ? d : d.length < 8 ? `${d.slice(0,3)}-${d.slice(3)}` : `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`; };
  const val = id => $('#a-in-' + id).value.trim();
  const formOk = () => val('name').length >= 2 && digits(val('tel')).length === 11 && val('addr1') !== '';
  // 저장된 주소를 쓰거나(addr), 폼을 제대로 채웠거나 둘 중 하나면 결제로 넘어갈 수 있다
  const addrReady = () => !!addr || formOk();

  function showAddr(a) {
    addr = a;
    $('#a-view').classList.toggle('hide', !a);
    $('#a-form').classList.toggle('hide', !!a);
    if (!a) return;
    $('#a-name').textContent = a.name;
    $('#a-tel').textContent = a.tel;
    $('#a-addr').textContent = `(${a.zip || ''}) ${a.addr1 || ''} ${a.addr2 || ''}`.trim();
    $('#a-memo').textContent = a.memo || '';
  }

  async function loadAddr(u) {
    // ★본인 것만 읽힌다(RLS select_own: user_id = auth.uid()). 남의 주소는 이 질의로도 안 나온다.
    const { data } = await sb.from('shipping_address')
      .select('id,name,tel,zip,addr1,addr2,memo')
      .eq('user_id', u.id).order('created_at', { ascending: false }).limit(1);
    showAddr(data && data.length ? data[0] : null);
  }

  // 저장된 주소가 있어도 다른 곳으로 받고 싶을 수 있다. 누르면 빈 폼이 열린다.
  $('#a-edit').addEventListener('click', () => { showAddr(null); drawSum(); });
  $('#a-in-tel').addEventListener('input', e => { e.target.value = telFmt(e.target.value); drawSum(); });
  ['name', 'addr1', 'addr2', 'memo'].forEach(id =>
    $('#a-in-' + id).addEventListener('input', drawSum));
  $('#a-find').addEventListener('click', () => {
    // 우편번호 스크립트가 막히면(광고차단 등) 직접 적게 열어준다. 주소 때문에 결제가 막히면 안 된다.
    if (window.__nozip || !window.daum || !daum.Postcode) {
      $('#a-in-zip').readOnly = false; $('#a-in-addr1').readOnly = false; $('#a-in-addr1').focus(); return;
    }
    new daum.Postcode({ oncomplete: d => {
      $('#a-in-zip').value = d.zonecode;
      $('#a-in-addr1').value = d.roadAddress || d.jibunAddress;
      $('#a-in-addr2').focus(); drawSum();
    }}).open();
  });

  // 결제 직전에 부른다. 새로 적은 주소면 저장하고 그 id를 돌려준다.
  async function ensureAddr() {
    if (addr) return addr.id;
    if (!formOk()) return null;
    const rec = { user_id: user.id, name: val('name'), tel: val('tel'),
      zip: val('zip'), addr1: val('addr1'), addr2: val('addr2'), memo: val('memo') };
    const { data, error } = await sb.from('shipping_address').insert(rec).select('id,name,tel,zip,addr1,addr2,memo').single();
    if (error) throw new Error('배송지 저장 실패: ' + error.message);
    showAddr(data);
    // ★4단계 전환: 배송지까지 넣은 사람 = 구매 의사가 가장 뚜렷한 층
    if (window.PHARMACIAN_TRACK) window.PHARMACIAN_TRACK.shipping();
    return data.id;
  }

  // ★getSession()과 onAuthStateChange가 둘 다 부른다. 막지 않으면 위젯이 두 번 그려지고,
  //   화면에 보이는 위젯과 결제를 요청하는 위젯이 서로 다른 물건이 된다
  //   ("결제수단이 선택되지 않았어요"가 뜨는데 화면엔 선택돼 있는 상태).
  let booted = false;
  async function boot(u) {
    if (booted && !!u === !!user) return;
    booted = true;
    user = u;
    $('#gate').classList.toggle('hide', !!u);
    $('#shop').classList.toggle('hide', !u);
    if (!u) return;
    // 로그인한 사람의 이메일을 넘기면 광고 전환 매칭률이 오른다(해싱은 메타·구글이 한다)
    if (window.PHARMACIAN_TRACK) window.PHARMACIAN_TRACK.identify({ email: u.email });

    const { data, error } = await sb.from('ph_product_price').select('key,price,ship');
    if (error || !data || !data.length) { $('#items').textContent = '가격을 불러오지 못했습니다.'; return; }
    rows = data.sort((a, b) => a.key.localeCompare(b.key));
    ship = rows[0].ship;
    // ★장바구니에 담아둔 수량을 이어받는다. 없으면 0에서 시작한다.
    const cart = (window.PH_CART ? PH_CART.read() : {});
    rows.forEach(r => qty[r.key] = cart[r.key] || 0);
    drawItems();
    await loadAddr(u);
    drawSum();

    // ★예약 중에는 결제창을 만들지 않는다. 돈을 받지 않으므로 결제 모듈이 필요 없다.
    if (RESERVE) { $('#pay').textContent = '예약 신청하기'; drawSum(); return; }
    if (window.__notoss || !window.TossPayments) { $('#note').textContent = '결제 모듈을 불러오지 못했습니다.'; return; }
    // customerKey는 회원마다 고정된 값이어야 한다. 우리 계정 id를 그대로 쓴다.
    widgets = window.TossPayments(C.TOSS_CLIENT).widgets({ customerKey: u.id });
    await widgets.setAmount({ currency: 'KRW', value: total() });
    await widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' });
    await widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' });
    drawSum();
  }

  $('#pay').addEventListener('click', async () => {
    $('#pay').disabled = true;
    try {
      // 받을 곳이 없으면 결제로 넘어가지 않는다. 새로 적었으면 여기서 저장된다.
      $('#a-err').classList.remove('on');
      const addressId = await ensureAddr();
      if (!addressId) {
        $('#a-err').textContent = '받는 분·연락처(11자리)·주소를 채워 주세요.';
        $('#a-err').classList.add('on');
        $('#a-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('#pay').disabled = false;
        return;
      }
      // ★주문은 서버가 만든다. 금액을 브라우저가 보내지 않는다.
      const items = rows.filter(r => qty[r.key] > 0).map(r => ({ key: r.key, qty: qty[r.key] }));
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${C.SUPABASE_URL}/functions/v1/ph-order-create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ items, coupon: coupon(), addressId, reserve: RESERVE }),
      });
      const order = await res.json();
      if (!res.ok) throw new Error(order.error || '주문 생성 실패');

      if (RESERVE) {
        // 돈은 받지 않았다. 무엇을 얼마에 예약했는지만 남기고 손님에게 그대로 알린다.
        if (window.PH_CART) PH_CART.clear();
        $('#shop').innerHTML =
          '<div class="box" style="text-align:center;padding:34px 22px">' +
          '<div style="font-size:21px;font-weight:800;letter-spacing:-.03em">예약이 접수되었습니다</div>' +
          '<p style="margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.7">' +
          '결제는 아직 열리지 않았습니다. <strong>지금 결제된 금액은 없습니다.</strong><br>' +
          '결제가 열리면 남겨 주신 연락처로 순서대로 안내드립니다.</p>' +
          '<dl style="margin-top:20px;text-align:left;border-top:1px solid var(--line)">' +
          '<div style="display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px">' +
          '<dt style="color:var(--ink-3)">예약번호</dt><dd style="font-weight:700">' + order.orderId + '</dd></div>' +
          '<div style="display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px">' +
          '<dt style="color:var(--ink-3)">예상 결제 금액</dt><dd style="font-weight:700">' + won(order.amount) + '원</dd></div>' +
          '</dl><a href="./" data-home style="display:inline-block;margin-top:22px;font-weight:700;' +
          'color:var(--accent);text-decoration:underline;text-underline-offset:4px">계속 둘러보기</a></div>';
        return;
      }

      // ★서버가 정한 금액이 화면과 다르면 결제창을 띄우지 않는다.
      //   전에는 쿠폰이 거절돼도 화면 합계가 그대로여서, 손님이 20,000원을 보고 23,000원 결제창을 봤다.
      //   화면을 서버값으로 다시 그리고, 손님이 보고 다시 눌러야 넘어간다.
      if (order.amount !== total()) {
        const lost = coupon() && !order.discount;
        if (lost) localStorage.removeItem('ph_coupon');
        srv = order;
        drawSum();
        $('#note').textContent = lost
          ? `첫 구매 쿠폰은 이미 쓰신 이력이 있어 적용되지 않았습니다. 결제 금액은 ${won(order.amount)}원입니다. 확인하시고 다시 눌러 주세요.`
          : `결제 금액이 ${won(order.amount)}원으로 정해졌습니다. 확인하시고 다시 눌러 주세요.`;
        $('#pay').disabled = false;
        return;
      }

      if (window.PHARMACIAN_TRACK) window.PHARMACIAN_TRACK.beginCheckout({ value: order.amount, orderId: order.orderId });
      // ★여기서 장바구니를 비우지 않는다. 결제창을 닫고 돌아오면 담아둔 게 통째로 사라진다.
      //   비우는 자리는 승인이 끝난 pay-done.html 이다.

      const first = NAMES[items[0].key] || 'PHARMACIAN 주문';
      const orderName = items.length > 1 ? `${first} 외 ${items.length - 1}건` : first;
      await widgets.setAmount({ currency: 'KRW', value: order.amount });
      await widgets.requestPayment({
        orderId: order.orderId,
        orderName,
        // ★origin에 붙이면 하위 경로 배포(/pharmacian/)에서 깨진다. 지금 주소 기준으로 만든다.
        successUrl: new URL('pay-done.html', location.href).href,
        failUrl: new URL('pay-done.html', location.href).href,
        customerEmail: user.email || undefined,
      });
    } catch (e) {
      $('#note').textContent = '결제를 시작하지 못했습니다: ' + e.message;
      $('#pay').disabled = false;
    }
  });

  sb.auth.getSession().then(({ data }) => boot(data.session && data.session.user));
  sb.auth.onAuthStateChange((_e, s) => boot(s && s.user));
})();
</script>
<script src="shell.js"></script>
</body>
</html>
